<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>ストップウォッチ</title>
    <link rel="stylesheet" href="main.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>
  <body>
    <h3>ストップウォッチ</h3>
    <div class="stopwatch">
        <span id="hours">0</span>:<span id="minutes">0</span>:<span id="seconds">0</span>:<span id="milliseconds">0</span>
    </div>
    <div class="buttons">
        <button id="btnstart">スタート</button>
        <button id="btnstop" disabled>ストップ</button>
        <button id="btnreset" disabled>リセット</button>
    </div>
    <script src="main.js"></script>
  </body>
</html>
